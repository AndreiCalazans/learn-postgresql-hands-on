<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Site.Params.description }}{{ . }}{{ else }}Hands-on PostgreSQL lessons.{{ end }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --surface: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --border: #1f2937;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }
    nav {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    nav .brand { font-weight: 700; letter-spacing: 0.02em; color: var(--text); }
    nav .menu a { margin-left: 16px; color: var(--muted); font-weight: 600; }
    nav .menu a.active { color: var(--accent); }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card-link {
      display: block;
      color: inherit;
      text-decoration: none;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }
    .card-link:hover {
      border-color: var(--accent);
      box-shadow: 0 16px 45px rgba(0,0,0,0.45);
      transform: translateY(-2px);
    }
    .card-link .pill.muted {
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
      font-weight: 600;
      margin-top: 12px;
      display: inline-flex;
    }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; }
    .pill.green { background: rgba(34,197,94,0.15); color: #4ade80; }
    .pill.yellow { background: rgba(245,158,11,0.15); color: #fcd34d; }
    .pill.red { background: rgba(239,68,68,0.15); color: #fca5a5; }
    footer { max-width: 1080px; margin: 0 auto; padding: 24px; color: var(--muted); text-align: center; border-top: 1px solid var(--border); }
    pre, code { background: #0b1220; border-radius: 12px; border: 1px solid var(--border); }
    pre { padding: 14px; overflow-x: auto; }
    h1, h2, h3, h4 { color: #f8fafc; letter-spacing: 0.01em; }
    blockquote { border-left: 4px solid var(--accent); margin: 0; padding-left: 12px; color: var(--muted); }
    @media (max-width: 640px) {
      nav { flex-direction: column; align-items: flex-start; gap: 8px; }
      nav .menu a { margin-left: 0; margin-right: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">{{ .Site.Title }}</a>
      <div class="menu">
        {{ $current := .RelPermalink }}
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="{{ if eq $current .URL }}active{{ end }}">{{ .Name }}</a>
        {{ end }}
      </div>
    </nav>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    Built with Hugo. Ship to Vercel with `npm run vercel-build`.
  </footer>
</body>
</html>
