{{ define "main" }}
  <section class="card" style="margin-bottom: 24px;">
    <h1>{{ .Title }}</h1>
    <p style="color: var(--muted); max-width: 800px;">{{ .Site.Params.description }}</p>
    <div class="content">{{ .Content }}</div>
  </section>
  {{ if .Pages }}
    <div class="grid">
      {{ range .Pages.ByWeight }}
        <article class="card">
          <h2 style="margin-top: 0;">{{ .Title }}</h2>
          {{ with .Params.level }}<div class="pill {{ if in . "🟢" }}green{{ else if in . "🟡" }}yellow{{ else }}red{{ end }}">{{ . }}</div>{{ end }}
          {{ with .Params.summary }}<p style="color: var(--muted);">{{ . }}</p>{{ end }}
          <a href="{{ .RelPermalink }}">Open lesson →</a>
        </article>
      {{ end }}
    </div>
  {{ end }}
{{ end }}
